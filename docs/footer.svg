<svg xmlns="http://www.w3.org/2000/svg"
     width="1010"
     height="100"
     viewBox="0 0 1010 100"
     fill="none">

  <defs>

    <!-- PREMIUM ACCENT -->

    <linearGradient id="footerAccent"
                    x1="0"
                    y1="0"
                    x2="1010"
                    y2="0"
                    gradientUnits="userSpaceOnUse">

      <stop stop-color="#76DFE3"/>
      <stop offset=".45" stop-color="#80B7FF"/>
      <stop offset="1" stop-color="#8CEBA8"/>

    </linearGradient>


    <!-- BACKGROUND DEPTH -->

    <linearGradient id="footerBackground"
                    x1="0"
                    y1="0"
                    x2="1010"
                    y2="100"
                    gradientUnits="userSpaceOnUse">

      <stop stop-color="#08131C"/>
      <stop offset="1" stop-color="#0D1D2A"/>

    </linearGradient>


    <!-- GLOW -->

    <filter id="footerGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur
        stdDeviation="3"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <!-- MAIN FOOTER CARD -->

  <rect
    x="0.5"
    y="0.5"
    width="1009"
    height="99"
    rx="14"
    fill="url(#footerBackground)"
    stroke="#89E7E2"
    stroke-opacity=".18"
  />


  <!-- TOP SYSTEM LINE -->

  <rect
    x="1"
    y="1"
    width="1008"
    height="2"
    rx="1"
    fill="url(#footerAccent)"
    opacity=".65"
  />


  <!-- STATUS INDICATOR -->

  <circle
    cx="29"
    cy="30"
    r="4"
    fill="#89E7E2"
    filter="url(#footerGlow)"
  />


  <!-- SECTION TITLE -->

  <text
    x="42"
    y="35"
    fill="#DDFEFF"
    font-family="monospace"
    font-size="12"
    font-weight="700"
    letter-spacing="3">

    END OF TRANSMISSION

  </text>


  <!-- ACCENT BAR -->

  <rect
    x="24"
    y="46"
    width="155"
    height="3"
    rx="1.5"
    fill="url(#footerAccent)"
    opacity=".9"
  />


  <!-- MESSAGE -->

  <text
    x="24"
    y="76"
    fill="#AFC2CC"
    font-family="sans-serif"
    font-size="15"
    font-weight="500">

    Designed with intelligence. Engineered with intent. Built for impact.

  </text>


  <!-- SYSTEM STATUS -->

  <g transform="translate(695 28)">

    <circle
      cx="5"
      cy="5"
      r="4"
      fill="#8CEBA8"
      filter="url(#footerGlow)"
    />

    <text
      x="16"
      y="9"
      fill="#8CEBA8"
      font-family="monospace"
      font-size="10"
      letter-spacing="1.5">

      SYSTEM ONLINE

    </text>

  </g>


  <!-- IDENTITY -->

  <text
    x="986"
    y="76"
    text-anchor="end"
    fill="#54717D"
    font-family="monospace"
    font-size="10"
    letter-spacing="1.5">

    © 2026 PURNA TEJESHWARA REDDY · PTR.AI

  </text>


  <!-- TERMINAL CURSOR -->

  <rect
    x="967"
    y="25"
    width="5"
    height="10"
    rx="1"
    fill="#76DFE3"
    filter="url(#footerGlow)">

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1.2s"
      repeatCount="indefinite"
    />

  </rect>

</svg>
