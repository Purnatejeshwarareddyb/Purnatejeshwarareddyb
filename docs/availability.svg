<svg xmlns="http://www.w3.org/2000/svg"
     width="310"
     height="42"
     viewBox="0 0 310 42"
     fill="none">

  <defs>

    <linearGradient id="borderGradient"
                    x1="0"
                    y1="0"
                    x2="310"
                    y2="42"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#76DFE3"/>
      <stop offset=".5" stop-color="#8CEBA8"/>
      <stop offset="1" stop-color="#80B7FF"/>
    </linearGradient>

    <linearGradient id="statusGradient"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">
      <stop stop-color="#89E7E2"/>
      <stop offset="1" stop-color="#8CEBA8"/>
    </linearGradient>

    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur stdDeviation="3"
                      result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <!-- MAIN CONTAINER -->

  <rect
    x="0.5"
    y="0.5"
    width="309"
    height="41"
    rx="20.5"
    fill="#08131C"
    stroke="url(#borderGradient)"
    stroke-opacity=".45"
  />


  <!-- AI STATUS GLOW -->

  <circle
    cx="21"
    cy="21"
    r="5"
    fill="url(#statusGradient)"
    filter="url(#glow)"
  />


  <!-- PULSE -->

  <circle
    cx="21"
    cy="21"
    r="5"
    fill="#89E7E2"
    opacity=".45">

    <animate
      attributeName="r"
      values="5;11;5"
      dur="2s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values=".5;0;.5"
      dur="2s"
      repeatCount="indefinite"
    />

  </circle>


  <!-- AI ICON -->

  <text
    x="38"
    y="17"
    font-family="monospace"
    font-size="8"
    fill="#54717D"
    letter-spacing="1.8">

    AI/ML DEVELOPER

  </text>


  <!-- MAIN STATUS -->

  <text
    x="38"
    y="30"
    font-family="monospace"
    font-size="11"
    font-weight="700"
    fill="#DDFEFF"
    letter-spacing=".6">

    AVAILABLE FOR INNOVATION

  </text>


  <!-- LIVE INDICATOR -->

  <text
    x="267"
    y="24"
    font-family="monospace"
    font-size="8"
    fill="#8CEBA8"
    letter-spacing="1">

    LIVE

  </text>


  <!-- SMALL AI NODE -->

  <circle
    cx="289"
    cy="21"
    r="3"
    fill="#8CEBA8"
    filter="url(#glow)"
  />

</svg>
