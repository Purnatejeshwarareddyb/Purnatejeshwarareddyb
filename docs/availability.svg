<svg xmlns="http://www.w3.org/2000/svg" width="220" height="34" viewBox="0 0 220 34" fill="none">
  <rect width="220" height="34" rx="17" fill="#0A1620" stroke="#8CEBA8" stroke-opacity=".3"/>
  <circle cx="20" cy="17" r="5" fill="#8CEBA8"/>
  <circle cx="20" cy="17" r="5" fill="#8CEBA8" opacity=".4">
