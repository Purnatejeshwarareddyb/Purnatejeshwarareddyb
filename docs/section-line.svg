<svg xmlns="http://www.w3.org/2000/svg"
     width="1010"
     height="44"
     viewBox="0 0 1010 44"
     fill="none">

  <defs>

    <linearGradient id="lineGradient"
                    x1="0"
                    y1="0"
                    x2="1010"
                    y2="0"
                    gradientUnits="userSpaceOnUse">

      <stop offset="0" stop-color="#89E7E2" stop-opacity="0"/>

      <stop offset=".18" stop-color="#89E7E2" stop-opacity=".6"/>

      <stop offset=".5" stop-color="#80B7FF" stop-opacity=".8"/>

      <stop offset=".82" stop-color="#8CEBA8" stop-opacity=".6"/>

      <stop offset="1" stop-color="#8CEBA8" stop-opacity="0"/>

    </linearGradient>

  </defs>


  <!-- MAIN DATA FLOW -->

  <line
    x1="0"
    y1="26"
    x2="1010"
    y2="26"
    stroke="url(#lineGradient)"
    stroke-width="1.5"
  />


  <!-- DATA NODE -->

  <circle
    cx="160"
    cy="26"
    r="5"
    fill="#89E7E2"
  />

  <circle
    cx="160"
    cy="26"
    r="10"
    stroke="#89E7E2"
    stroke-opacity=".28"
    stroke-width="1"
  />


  <!-- MODEL NODE -->

  <circle
    cx="505"
    cy="26"
    r="7"
    fill="#80B7FF"
  />

  <circle
    cx="505"
    cy="26"
    r="14"
    stroke="#80B7FF"
    stroke-opacity=".3"
    stroke-width="1"
  />

  <circle
    cx="505"
    cy="26"
    r="20"
    stroke="#80B7FF"
    stroke-opacity=".1"
    stroke-width="1"
  />


  <!-- IMPACT NODE -->

  <circle
    cx="850"
    cy="26"
    r="5"
    fill="#8CEBA8"
  />

  <circle
    cx="850"
    cy="26"
    r="10"
    stroke="#8CEBA8"
    stroke-opacity=".28"
    stroke-width="1"
  />


  <!-- LABELS -->

  <text
    x="160"
    y="10"
    text-anchor="middle"
    fill="#89E7E2"
    font-family="monospace"
    font-size="10"
    font-weight="700"
    letter-spacing="2">

    DATA

  </text>


  <text
    x="505"
    y="10"
    text-anchor="middle"
    fill="#80B7FF"
    font-family="monospace"
    font-size="10"
    font-weight="700"
    letter-spacing="2">

    INTELLIGENCE

  </text>


  <text
    x="850"
    y="10"
    text-anchor="middle"
    fill="#8CEBA8"
    font-family="monospace"
    font-size="10"
    font-weight="700"
    letter-spacing="2">

    IMPACT

  </text>


  <!-- FLOW ARROWS -->

  <path
    d="M330 22L338 26L330 30"
    stroke="#89E7E2"
    stroke-width="1.2"
    fill="none"
    opacity=".7"
  />


  <path
    d="M675 22L683 26L675 30"
    stroke="#8CEBA8"
    stroke-width="1.2"
    fill="none"
    opacity=".7"
  />


  <!-- SMALL DATA PARTICLES -->

  <circle
    cx="250"
    cy="26"
    r="2"
    fill="#89E7E2"
    opacity=".45"
  />

  <circle
    cx="410"
    cy="26"
    r="2"
    fill="#80B7FF"
    opacity=".35"
  />

  <circle
    cx="600"
    cy="26"
    r="2"
    fill="#80B7FF"
    opacity=".35"
  />

  <circle
    cx="760"
    cy="26"
    r="2"
    fill="#8CEBA8"
    opacity=".45"
  />

</svg>
