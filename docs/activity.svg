<svg xmlns="http://www.w3.org/2000/svg"
     width="1010"
     height="190"
     viewBox="0 0 1010 190"
     fill="none">

  <defs>

    <linearGradient id="background" x1="0" y1="0" x2="1010" y2="190">
      <stop stop-color="#08131C"/>
      <stop offset="1" stop-color="#0D1D2A"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1010" y2="0">
      <stop stop-color="#76DFE3"/>
      <stop offset="0.5" stop-color="#89E7E2"/>
      <stop offset="1" stop-color="#80B7FF"/>
    </linearGradient>

    <filter id="glow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- CLICKABLE GITHUB PROFILE -->

  <a href="https://github.com/Purnatejeshwarareddyb"
     target="_blank">

    <!-- MAIN CARD -->

    <rect
      x="0.5"
      y="0.5"
      width="1009"
      height="189"
      rx="14"
      fill="url(#background)"
      stroke="#89E7E2"
      stroke-opacity=".2"
    />


    <!-- TOP ACCENT -->

    <rect
      x="1"
      y="1"
      width="1008"
      height="3"
      rx="2"
      fill="url(#accent)"
      opacity=".8"
    />


    <!-- HEADER STATUS -->

    <circle
      cx="29"
      cy="29"
      r="5"
      fill="#76DFE3"
      filter="url(#glow)"
    />


    <!-- TITLE -->

    <text
      x="44"
      y="34"
      fill="#DDFEFF"
      font-family="monospace"
      font-size="14"
      font-weight="700"
      letter-spacing="2.5">

      GITHUB CONTRIBUTION ACTIVITY

    </text>


    <!-- USERNAME -->

    <text
      x="24"
      y="55"
      fill="#76DFE3"
      font-family="monospace"
      font-size="10"
      letter-spacing="1.5">

      @PURNATEJESHWARAREDDYB · LIVE DEVELOPMENT TIMELINE

    </text>


    <!-- DIVIDER -->

    <line
      x1="24"
      y1="68"
      x2="986"
      y2="68"
      stroke="#89E7E2"
      stroke-opacity=".12"
    />


    <!-- LIVE GITHUB CONTRIBUTION GRAPH -->

    <foreignObject
      x="24"
      y="78"
      width="962"
      height="75">

      <div xmlns="http://www.w3.org/1999/xhtml"
           style="
             width:100%;
             height:100%;
             overflow:hidden;
             border-radius:8px;
             opacity:0.95;
           ">

        <img
          src="https://ghchart.rshah.org/89E7E2/Purnatejeshwarareddyb"
          width="100%"
          height="100%"
          style="
            object-fit:cover;
            object-position:left center;
          "
        />

      </div>

    </foreignObject>


    <!-- FOOTER -->

    <line
      x1="24"
      y1="163"
      x2="986"
      y2="163"
      stroke="#89E7E2"
      stroke-opacity=".1"
    />


    <!-- LIVE INDICATOR -->

    <circle
      cx="29"
      cy="177"
      r="4"
      fill="#89E7E2"
      filter="url(#glow)"
    />


    <text
      x="42"
      y="181"
      fill="#76DFE3"
      font-family="monospace"
      font-size="10"
      letter-spacing="1.3">

      LIVE DATA · AUTO UPDATED FROM GITHUB

    </text>


    <!-- CLICK ACTION -->

    <text
      x="790"
      y="181"
      fill="#54717D"
      font-family="monospace"
      font-size="10"
      letter-spacing="1">

      CLICK TO VIEW PROFILE ↗

    </text>

  </a>

</svg>
