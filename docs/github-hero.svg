<svg xmlns="http://www.w3.org/2000/svg"
     width="1010"
     height="440"
     viewBox="0 0 1010 440"
     fill="none">

  <defs>

    <!-- ============================= -->
    <!-- BACKGROUND -->
    <!-- ============================= -->

    <linearGradient id="bg"
                    x1="0"
                    y1="0"
                    x2="1010"
                    y2="440"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#020A12"/>
      <stop offset=".48" stop-color="#06131E"/>
      <stop offset="1" stop-color="#071B22"/>
    </linearGradient>


    <!-- MAIN ACCENT -->

    <linearGradient id="accent"
                    x1="0"
                    y1="0"
                    x2="1010"
                    y2="0"
                    gradientUnits="userSpaceOnUse">

      <stop stop-color="#42D8E6"/>
      <stop offset=".48" stop-color="#3F91FF"/>
      <stop offset="1" stop-color="#65E7A6"/>

    </linearGradient>


    <!-- NAME GRADIENT -->

    <linearGradient id="nameGradient"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="1">

      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#AFC3D8"/>

    </linearGradient>


    <!-- HUD GLOW -->

    <radialGradient id="hudGlow"
                    cx="0"
                    cy="0"
                    r="1"
                    gradientTransform="translate(730 205) rotate(90) scale(180)">

      <stop stop-color="#38D7D8"
            stop-opacity=".18"/>

      <stop offset=".55"
            stop-color="#3D92FF"
            stop-opacity=".08"/>

      <stop offset="1"
            stop-color="#38D7D8"
            stop-opacity="0"/>

    </radialGradient>


    <!-- GRID -->

    <pattern id="grid"
             width="32"
             height="32"
             patternUnits="userSpaceOnUse">

      <path
        d="M32 0H0V32"
        stroke="#4DCED5"
        stroke-opacity=".055"
        stroke-width=".7"/>

    </pattern>


    <!-- DOT PATTERN -->

    <pattern id="dots"
             width="18"
             height="18"
             patternUnits="userSpaceOnUse">

      <circle
        cx="1"
        cy="1"
        r=".65"
        fill="#59DCE0"
        fill-opacity=".28"/>

    </pattern>


    <!-- GLOW -->

    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur
        stdDeviation="3"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>


    <filter id="softGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur
        stdDeviation="8"
        result="blur"/>

    </filter>

  </defs>


  <!-- ============================= -->
  <!-- MAIN CONTAINER -->
  <!-- ============================= -->

  <rect
    width="1010"
    height="440"
    rx="22"
    fill="url(#bg)"
  />

  <rect
    x="1"
    y="1"
    width="1008"
    height="438"
    rx="21"
    stroke="url(#accent)"
    stroke-opacity=".55"
  />


  <!-- GRID -->

  <rect
    width="1010"
    height="440"
    rx="22"
    fill="url(#grid)"
  />


  <!-- RIGHT PARTICLE AREA -->

  <rect
    x="540"
    y="18"
    width="430"
    height="340"
    fill="url(#dots)"
    opacity=".45"
  />


  <!-- HUD LIGHT -->

  <rect
    width="1010"
    height="440"
    rx="22"
    fill="url(#hudGlow)"
  />


  <!-- ============================= -->
  <!-- CORNER BRACKETS -->
  <!-- ============================= -->

  <g
