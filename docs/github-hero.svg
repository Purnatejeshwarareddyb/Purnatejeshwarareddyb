<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="440" viewBox="0 0 1010 440" fill="none">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1010" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1620"/><stop offset=".5" stop-color="#0C1F2A"/><stop offset="1" stop-color="#08131B"/>
    </linearGradient>
    <linearGradient id="haccent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#89E7E2"/><stop offset=".55" stop-color="#80B7FF"/><stop offset="1" stop-color="#8CEBA8"/>
    </linearGradient>
    <radialGradient id="hglow" cx="0" cy="0" r="1" gradientTransform="translate(820 200) rotate(90) scale(300)">
      <stop stop-color="#89E7E2" stop-opacity=".16"/><stop offset="1" stop-color="#89E7E2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hgrid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" stroke="#89E7E2" stroke-opacity=".08"/></pattern>
  </defs>

  <rect width="1010" height="440" rx="22" fill="url(#hbg)"/>
  <rect x="1" y="1" width="1008" height="438" rx="21" stroke="#89E7E2" stroke-opacity=".2"/>
  <rect x="1" y="1" width="1008" height="438" rx="21" fill="url(#hgrid)"/>
  <rect width="1010" height="440" rx="22" fill="url(#hglow)"/>

  <!-- corner brackets -->
  <g stroke="#89E7E2" stroke-width="2">
    <path d="M40 40H70M40 40V70"/><path d="M970 40H940M970 40V70"/>
    <path d="M40 400H70M40 400V370"/><path d="M970 400H940M970 400V370"/>
  </g>

  <!-- top mono labels -->
  <text x="40" y="100" fill="#76DFE3" font-family="monospace" font-size="13" letter-spacing="4">AI / ML ENGINEER · SYSTEMS BUILDER</text>
  <text x="970" y="100" text-anchor="end" fill="#54717D" font-family="monospace" font-size="12" letter-spacing="3">PORTFOLIO // 001</text>

  <!-- name -->
  <text x="40" y="200" fill="#EAF2F8" font-family="sans-serif" font-size="62" font-weight="800" letter-spacing="-3.5">Purna Tejeshwara</text>
  <text x="40" y="266" fill="#EAF2F8" font-family="sans-serif" font-size="62" font-weight="800" letter-spacing="-3.5">Reddy<tspan fill="url(#haccent)">.</tspan></text>

  <!-- tagline -->
  <text x="42" y="312" fill="#9AADB6" font-family="sans-serif" font-size="19">Building intelligence that moves ideas forward.</text>

  <!-- accent bar -->
  <rect x="42" y="334" width="140" height="4" rx="2" fill="url(#haccent)"/>

  <!-- bottom mono row -->
  <text x="40" y="400" fill="#54717D" font-family="monospace" font-size="12" letter-spacing="2">PYTHON · PYTORCH · OPENCV · DOCKER · LLMs</text>
  <text x="970" y="400" text-anchor="end" fill="#54717D" font-family="monospace" font-size="12" letter-spacing="2">PTR.AI / 2026</text>

  <!-- right decorative rings -->
  <g transform="translate(820 220)" stroke="#89E7E2" stroke-opacity=".18" fill="none">
    <circle r="110" stroke-width="1.5"/><circle r="80" stroke-width="1"/><circle r="50" stroke-width="1"/>
    <circle r="120" stroke-dasharray="4 8" stroke-width="1"/>
    <circle cx="110" cy="0" r="4" fill="#89E7E2" stroke="none"/>
    <circle cx="0" cy="-80" r="3" fill="#80B7FF" stroke="none"/>
    <circle cx="-50" cy="35" r="3" fill="#8CEBA8" stroke="none"/>
  </g>
</svg>
